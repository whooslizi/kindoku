name: test, build, release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Lint plugin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
          luacheck kinkoku.koplugin

      - name: Build
        run: |
          echo "VERSION=v0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          scripts/build.sh "v0.1.${{ github.run_number }}"
          mkdir -p dist
          for arch in armv6 armv7 arm64 x64; do
            rm -rf stage && mkdir stage && cp -r kinkoku.koplugin stage/
            find stage/kinkoku.koplugin/bin -mindepth 1 -maxdepth 1 ! -name "$arch" -exec rm -rf {} +
            (cd stage && zip -qr "../dist/kinkoku-$arch.koplugin.zip" kinkoku.koplugin)
          done

      - name: Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" --title "kinkoku $VERSION" --generate-notes
