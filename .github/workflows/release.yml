name: test, build, release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Lint plugin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
          luacheck kinkoku.koplugin

      - name: Build
        run: |
          echo "VERSION=v0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          scripts/build.sh "v0.1.${{ github.run_number }}"
          mkdir -p dist
          zip -qr dist/kinkoku.koplugin.zip kinkoku.koplugin

      - name: Release
        # only the default branch publishes; other branches just test and build
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/kinkoku.koplugin.zip \
            --target "$GITHUB_SHA" --title "kinkoku $VERSION" --generate-notes
